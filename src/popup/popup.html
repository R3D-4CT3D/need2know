<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What Sites See</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
  <header class="mast">
    <span class="wm"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="14" ry="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="var(--stamp)"/></svg>What Sites See</span>
    <span class="host mono" id="host"></span>
  </header>

  <section class="perm" id="perm" hidden>
    <p><strong>Site access is off.</strong> Your browser needs your OK before this extension can watch pages.</p>
    <button id="grant">Allow on all sites</button>
    <p class="sub">Then reload the page you want to check.</p>
  </section>

  <section class="shield" id="shield" hidden>
    <div class="shield-row">
      <label class="switch"><input type="checkbox" id="protect-site" role="switch"><span class="track" aria-hidden="true"></span><span id="shield-label">Protection</span></label>
      <span class="mode" id="shield-mode"></span>
    </div>
    <p class="mismatch" id="mismatch" hidden><span id="mismatch-text"></span> <button class="reload" id="reload">Reload now</button></p>
    <div class="pause">
      <span id="pause-text"></span>
      <button class="mini" data-pause="60">Pause 1 hour</button>
      <button class="mini" data-pause="-1">Pause until restart</button>
      <button class="mini" data-pause="0">Resume protection</button>
    </div>
  </section>

  <section class="summary">
    <div class="score" aria-live="polite"><span id="score">–</span><small>/100</small></div>
    <div><div class="label" id="label">Loading…</div><div class="sub" id="sub"></div><div class="sub compare" id="compare" hidden></div></div>
  </section>
  <div class="meter" aria-hidden="true"><span id="fill"></span></div>

  <ol class="items" id="items"></ol>
  <p class="empty" id="empty" hidden></p>
  <p class="tip" id="tip" hidden></p>

  <details class="hosts" id="hosts" hidden>
    <summary id="hosts-sum"></summary>
    <ul class="mono" id="hosts-list"></ul>
  </details>

  <div class="act" id="act" hidden>
    <button class="btn-act" id="request">Ask this site to delete my data</button>
    <button class="btn-act" id="evidence">Evidence report</button>
  </div>

  <footer>
    <button class="link" data-open="checkup/checkup.html">Checkup</button>
    <button class="link" data-open="findings/findings.html">Findings</button>
    <button class="link" data-open="history/history.html">History</button>
    <button class="link" data-open="options/options.html">Settings</button>
  </footer>
</body>
</html>
